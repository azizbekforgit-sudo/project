<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https: *; connect-src 'self' https: wss:; font-src 'self' https: data:;" />
  <title>AgroVerse — рынок фермеров</title>
  <script>
    /* Тема до отрисовки, чтобы не было вспышки: выбор человека, иначе — настройка телефона */
    (function () {
      var th = null;
      try { th = localStorage.getItem('av_theme'); } catch (e) {}
      if (th !== 'light' && th !== 'dark') th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = th;
    })();
  </script>

  <style id="splash-css">
    /* ===== Заставка при открытии сайта: всё внутри файла, чтобы появиться мгновенно ===== */
    #splash{position:fixed;inset:0;z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;
      overflow:hidden;background:linear-gradient(180deg,#FBF6E4 0%,#F6F6F1 55%,#EEF3E6 100%);color:#1A201C;
      font-family:'Rubik','Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
      transition:opacity .5s ease,transform .5s ease,visibility 0s .5s}
    :root[data-theme="dark"] #splash{background:linear-gradient(180deg,#0E1712 0%,#0B140F 60%,#09110C 100%);color:#F3EFE4}
    #splash.out{opacity:0;transform:scale(1.04);visibility:hidden;pointer-events:none}

    /* солнце и холмы */
    #splash .sp-sun{position:absolute;left:50%;bottom:7vh;width:min(46vw,260px);aspect-ratio:1;transform:translate(-50%,40px);border-radius:50%;
      background:radial-gradient(circle,#FFD36B 0%,#F0B429 46%,rgba(240,180,41,0) 70%);opacity:0;
      animation:sp-sunrise 1.8s .2s cubic-bezier(.16,1,.3,1) forwards,sp-sunbreath 4s 2s ease-in-out infinite}
    :root[data-theme="dark"] #splash .sp-sun{background:radial-gradient(circle,rgba(255,200,90,.95) 0%,rgba(240,180,41,.55) 40%,rgba(240,180,41,0) 70%)}
    #splash .sp-hill{position:absolute;left:50%;border-radius:50% 50% 0 0/100% 100% 0 0;transform:translateX(-50%)}
    #splash .sp-hill.b{bottom:-14vh;width:170vw;height:36vh;background:linear-gradient(180deg,#D3E6C9,#BFD9B3)}
    #splash .sp-hill.f{bottom:-20vh;width:190vw;height:36vh;background:linear-gradient(180deg,#A9CFA0,#8FBF86)}
    :root[data-theme="dark"] #splash .sp-hill.b{background:linear-gradient(180deg,#14301F,#0F2217)}
    :root[data-theme="dark"] #splash .sp-hill.f{background:linear-gradient(180deg,#0F2418,#0A170F)}

    /* значок: зерно падает, вырастает росток */
    #splash .sp-mark{position:relative;width:112px;height:112px;margin-bottom:22px;z-index:2}
    #splash .sp-mark::before{content:"";position:absolute;inset:-34px;border-radius:50%;
      background:radial-gradient(circle,rgba(240,180,41,.45),rgba(240,180,41,0) 68%);opacity:0;animation:sp-glow 2.6s 1.2s ease-in-out infinite}
    #splash .sp-mark svg{position:relative;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 14px 22px rgba(20,61,36,.28))}
    #splash .sp-tile{transform-origin:256px 256px;animation:sp-tile .6s cubic-bezier(.2,.9,.25,1.25) both}
    #splash .sp-seed{transform-origin:256px 404px;opacity:0;animation:sp-seed .62s .28s cubic-bezier(.5,0,.9,.5) forwards}
    #splash .sp-stem{stroke-dasharray:1;stroke-dashoffset:1;animation:sp-draw .5s .84s cubic-bezier(.16,1,.3,1) forwards}
    #splash .sp-leaf{transform:scale(0);animation:sp-leaf .55s cubic-bezier(.2,.9,.25,1.3) forwards}
    #splash .sp-leaf.l{transform-origin:256px 270px;animation-delay:1.18s}
    #splash .sp-leaf.r{transform-origin:256px 236px;animation-delay:1.34s}
    #splash .sp-sway{transform-origin:256px 404px;animation:sp-sway 3.2s 2s ease-in-out infinite alternate}

    #splash .sp-name{position:relative;z-index:2;font-weight:700;font-size:clamp(30px,8vw,40px);letter-spacing:-.02em;line-height:1;
      opacity:0;transform:translateY(12px);animation:sp-rise .6s 1.15s cubic-bezier(.16,1,.3,1) forwards}
    #splash .sp-name b{font-weight:700;color:#1F5C35}
    :root[data-theme="dark"] #splash .sp-name b{color:#F0B429}
    #splash .sp-tag{position:relative;z-index:2;margin:10px 24px 0;text-align:center;font-family:'Golos Text','Rubik',system-ui,sans-serif;font-weight:500;
      font-size:clamp(15px,4vw,18px);opacity:0;color:#434B45;animation:sp-rise .6s 1.4s cubic-bezier(.16,1,.3,1) forwards}
    :root[data-theme="dark"] #splash .sp-tag{color:#C9C3B3}
    #splash .sp-bar{position:relative;z-index:2;width:min(52vw,190px);height:5px;margin-top:26px;border-radius:99px;overflow:hidden;
      background:rgba(31,92,53,.14);opacity:0;animation:sp-rise .5s 1.55s ease forwards}
    :root[data-theme="dark"] #splash .sp-bar{background:rgba(243,239,228,.14)}
    #splash .sp-bar i{position:absolute;top:0;bottom:0;left:0;width:40%;border-radius:99px;background:linear-gradient(90deg,#F0B429,#FFD36B);
      animation:sp-load 1.35s 1.6s cubic-bezier(.65,0,.35,1) infinite}

    @keyframes sp-tile{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
    @keyframes sp-seed{0%{opacity:1;transform:translateY(-520px) scale(1,1.25)}78%{opacity:1;transform:translateY(0) scale(1,1.25)}88%{opacity:1;transform:translateY(0) scale(1.35,.6)}100%{opacity:0;transform:translateY(0) scale(.6,.6)}}
    @keyframes sp-draw{to{stroke-dashoffset:0}}
    @keyframes sp-leaf{to{transform:scale(1)}}
    @keyframes sp-sway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
    @keyframes sp-glow{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:.9;transform:scale(1.06)}}
    @keyframes sp-rise{to{opacity:1;transform:none}}
    @keyframes sp-load{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
    @keyframes sp-sunrise{to{opacity:1;transform:translate(-50%,0)}}
    @keyframes sp-sunbreath{0%,100%{transform:translate(-50%,0) scale(1)}50%{transform:translate(-50%,-4px) scale(1.05)}}

    @media (prefers-reduced-motion:reduce){
      #splash *,#splash{animation-duration:.01s !important;animation-delay:0s !important;animation-iteration-count:1 !important}
      #splash .sp-bar i{animation:none;width:100%}
    }
  </style>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23000'/><path d='M14 32 L32 14 L50 32 L38 32 L38 50 L26 50 L26 32 Z' fill='%2310b981' opacity='0.9'/><path d='M20 38 L32 20 L44 38 L36 38 L36 52 L28 52 L28 38 Z' fill='%234ade80' opacity='0.6'/></svg>" />

</head>
<body>
  <!-- Decorative background elements -->
  <div class="decoration-dots" id="decoration"></div>

  <!-- Заставка: исчезает, когда сайт загрузился (скрипт внизу страницы) -->
  <div id="splash" role="status" aria-live="polite" aria-label="AgroVerse">
    <div class="sp-sun"></div>
    <div class="sp-hill b"></div>
    <div class="sp-hill f"></div>
    <div class="sp-mark">
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <g class="sp-tile">
          <rect width="512" height="512" rx="112" fill="#1F5C35"/>
          <circle cx="256" cy="256" r="196" fill="#2A7346" opacity=".55"/>
        </g>
        <circle class="sp-seed" cx="256" cy="404" r="20" fill="#F0B429"/>
        <g class="sp-sway">
          <path class="sp-stem" pathLength="1" d="M256 404 V262" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" fill="none"/>
          <path class="sp-leaf l" d="M256 270 C 252 196 200 150 120 146 C 118 222 166 270 256 270 Z" fill="#FFFFFF"/>
          <path class="sp-leaf r" d="M256 236 C 262 160 316 112 398 110 C 400 190 350 236 256 236 Z" fill="#FFFFFF"/>
        </g>
      </svg>
    </div>
    <div class="sp-name">Agro<b>Verse</b></div>
    <div class="sp-tag" id="sp-tag"></div>
    <div class="sp-bar"><i></i></div>
  </div>
  <script>
    (function () {
      var L = 'uz';
      try { L = localStorage.getItem('av_lang') || 'uz'; } catch (e) {}
      var T = {
        uz: 'Fermerlar bozori — to‘g‘ridan-to‘g‘ri',
        ru: 'Рынок фермеров — напрямую',
        en: 'Farmers’ market — straight from the field'
      };
      document.getElementById('sp-tag').textContent = T[L] || T.uz;
      window.__splashT0 = Date.now();
    })();
  </script>

  <script>
    // Generate decorative dots
    const decoration = document.getElementById('decoration');
    for (let i = 0; i < 30; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.style.left = Math.random() * 100 + '%';
      dot.style.top = Math.random() * 100 + '%';
      dot.style.animationDelay = Math.random() * 4 + 's';
      decoration.appendChild(dot);
    }

    // Заставка: уходит, когда страница загрузилась. Минимум показываем, чтобы анимация доиграла
    // (при повторном открытии в этой же вкладке — короче), максимум 9 с, чтобы не зависнуть.
    (function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      var seen = false;
      try { seen = sessionStorage.getItem('av_splash') === '1'; sessionStorage.setItem('av_splash', '1'); } catch (e) {}
      var MIN = seen ? 350 : 1900;
      var done = false;
      function hide() {
        if (done) return; done = true;
        splash.classList.add('out');
        setTimeout(function () { splash.remove(); var c = document.getElementById('splash-css'); if (c) c.remove(); }, 700);
      }
      function ready() {
        var left = Math.max(0, MIN - (Date.now() - (window.__splashT0 || Date.now())));
        setTimeout(hide, left);
      }
      if (document.readyState === 'complete') ready(); else window.addEventListener('load', ready);
      setTimeout(hide, 9000);
    })();
  </script>
